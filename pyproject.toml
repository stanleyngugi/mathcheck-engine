[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-kernel-verifier"
version = "0.3.2"
description = "MathCheck Engine: bounded mathematical answers checked with generated Lean 4 programs"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
    { name = "Stanley Ngugi" }
]
keywords = ["lean4", "formal-verification", "symbolic-computation", "berlekamp-massey", "groebner-basis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
lean-isolated = "lean_kernel_verifier.isolation:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lean_kernel_verifier*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
