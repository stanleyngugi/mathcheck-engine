name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run test suite with live Lean checks
        shell: bash
        run: |
          echo "LEAN_BIN=$(elan which lean)" >> "$GITHUB_ENV"
          python -m pytest tests -q
      - name: Run public example
        shell: bash
        run: python examples/bounded_count.py --lean-bin "$(elan which lean)"
